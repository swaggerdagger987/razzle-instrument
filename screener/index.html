<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Razzle Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Luckiest+Guy&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="screener.css">
</head>
<body>
<header>
  <a class="logo" href="index.html" aria-label="Razzle">
    <span class="logo-mark" aria-hidden="true">&#x1F42F;</span>
    <span class="logo-text">Razzle</span>
  </a>
  <h1>SCREENER</h1>
  <div class="switch" role="tablist" aria-label="League">
    <button type="button" id="tab-nfl" role="tab" aria-selected="true">NFL</button>
    <button type="button" id="tab-college" role="tab" aria-selected="false">College</button>
  </div>
</header>
<div class="toolbar">
  <label class="control">Season
    <select id="season-select" aria-label="Season"></select>
  </label>
  <label class="control" id="week-control">Week
    <select id="week-select" aria-label="Week"></select>
  </label>
  <div class="chips" role="group" aria-label="Position">
    <button type="button" class="chip on" data-pos="ALL">All</button>
    <button type="button" class="chip" data-pos="QB">QB</button>
    <button type="button" class="chip" data-pos="RB">RB</button>
    <button type="button" class="chip" data-pos="WR">WR</button>
    <button type="button" class="chip" data-pos="TE">TE</button>
  </div>
  <input id="search" type="search" placeholder="search players" aria-label="Search players" autocomplete="off">
  <span id="count" class="count" aria-live="polite"></span>
</div>
<div class="table-wrap">
  <table>
    <caption class="sr-only" id="caption">NFL player screener</caption>
    <thead id="head"></thead>
    <tbody id="body"></tbody>
  </table>
  <p id="empty" class="empty" hidden></p>
</div>
<footer>the screener is forever free.</footer>
<p class="watermark">razzle.lol — let's razzle dazzle em baby</p>
<script src="screener.js"></script>
</body>
</html>
